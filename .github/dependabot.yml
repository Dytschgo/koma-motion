# Weekly dependency updates. See "Workflow and dependency policy" in
# docs/RELEASES.md. apps/desktop/scripts/workflow-policy.test.mjs checks this
# file.
version: 2

updates:
  - package-ecosystem: npm
    # The pnpm workspace. Its packages are found through pnpm-workspace.yaml.
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    # pnpm 11 refuses packages younger than one day. Seven days keep version
    # updates clear of that limit and of releases that are withdrawn early.
    # The cooldown does not delay security updates.
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
    groups:
      # Minor and patch updates arrive as one pull request. A major update
      # gets its own.
      minor-and-patch:
        patterns:
          - '*'
        exclude-patterns:
          # Pinned exactly: the update path and the PDF parser. Each update
          # gets its own pull request and a deliberate review.
          - electron-updater
          - pdfjs-dist
        update-types:
          - minor
          - patch
    ignore:
      # Held at ~6.0: the type-aware linter supports TypeScript below 6.1.
      # Patch updates still arrive. Remove this when the linter supports a
      # newer compiler. See ARCHITECTURE.md.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  - package-ecosystem: github-actions
    # Covers .github/workflows. Actions are pinned to commit SHAs. Dependabot
    # updates the SHA together with the version comment behind it.
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies
    groups:
      actions:
        patterns:
          - '*'
