name: Publish nightly prerelease

# A nightly is built on request from a commit of main and published as a
# prerelease. It never becomes the latest release. See docs/RELEASES.md.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit of main to build. Empty builds the newest commit of main.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  guard:
    name: Check the commit
    # The workflow can be started from any branch. Nightlies only come from main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      version: ${{ steps.candidate.outputs.version }}
      tag: ${{ steps.candidate.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: candidate
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          git fetch --force origin +refs/heads/main:refs/remotes/origin/main
          requested="${REQUESTED_SHA:-$(git rev-parse origin/main)}"
          [[ "$requested" =~ ^[0-9a-fA-F]{40}$ ]]
          actual="$(git rev-parse "$requested^{commit}")"
          test "$actual" = "${requested,,}"
          git merge-base --is-ancestor "$actual" origin/main
          base="$(git show "$actual:apps/desktop/package.json" | node -e "let text=''; process.stdin.on('data', (chunk) => text += chunk).on('end', () => process.stdout.write(JSON.parse(text).version))")"
          version="$(node apps/desktop/scripts/release-channel.mjs nightly-version "$base" "$(date -u +%Y%m%d)" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT")"
          echo "sha=$actual" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Nightly $version from $actual" >> "$GITHUB_STEP_SUMMARY"

  ci-coverage:
    name: Check existing CI
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      covered: ${{ steps.decision.outputs.covered }}
    steps:
      # Use the workflow's policy even when building a historical candidate.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
      - name: Preserve the current quality policy
        shell: bash
        run: cp apps/desktop/scripts/ci-quality.mjs "$RUNNER_TEMP/koma-ci-quality.mjs"
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.guard.outputs.sha }}
      - id: decision
        shell: bash
        env:
          SHA: ${{ needs.guard.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&per_page=20" > runs.json
          run_id="$(node "$RUNNER_TEMP/koma-ci-quality.mjs" select-run runs.json "$SHA")"
          if [ -z "$run_id" ]; then
            echo "covered=false" >> "$GITHUB_OUTPUT"
            echo "No completed successful CI run covers ${SHA}." >> "$GITHUB_STEP_SUMMARY"
          else
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" > jobs.json
            covered="$(node "$RUNNER_TEMP/koma-ci-quality.mjs" covers-quality jobs.json)"
            echo "covered=${covered}" >> "$GITHUB_OUTPUT"
            echo "CI run ${run_id} covers the Windows and macOS quality checks: ${covered}." >> "$GITHUB_STEP_SUMMARY"
          fi

  quality:
    name: Check the code (${{ matrix.os }})
    needs: [guard, ci-coverage]
    if: |
      always() &&
      needs.guard.result == 'success' &&
      (needs.ci-coverage.result != 'success' || needs.ci-coverage.outputs.covered != 'true')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      # Use the workflow's policy even when building a historical candidate.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
      - name: Preserve the current quality policy
        shell: bash
        run: cp apps/desktop/scripts/ci-quality.mjs "$RUNNER_TEMP/koma-ci-quality.mjs"
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.guard.outputs.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: matrix.os == 'windows-latest'
        run: pnpm format:check
      - if: matrix.os == 'windows-latest'
        run: pnpm lint
      - if: matrix.os == 'windows-latest'
        run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Run application tests
        id: application
        working-directory: apps/desktop
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/report.json
        run: pnpm exec playwright test "--reporter=list,github,json"
      - name: Summarize retries and skipped tests
        if: always() && steps.application.outcome != 'skipped'
        run: node "${{ runner.temp }}/koma-ci-quality.mjs" summarize-report apps/desktop/test-results/report.json
      - name: Keep application test reports and traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-test-results-${{ matrix.os }}
          path: apps/desktop/test-results
          if-no-files-found: ignore
          retention-days: 7

  package:
    name: Package (${{ matrix.platform }})
    # Runs beside the checks of the code. Publishing needs both.
    needs: guard
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            builder: --win
          - os: macos-latest
            platform: macos
            builder: --mac --universal
    env:
      KOMA_EXPECT_VERSION: ${{ needs.guard.outputs.version }}
      # The installers are not signed with a certificate.
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.guard.outputs.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Package with the version of the nightly
        working-directory: apps/desktop
        # PowerShell splits options at a dot, so this runs in bash on every platform.
        shell: bash
        # The version is set for this build only. Nothing is committed.
        run: >-
          pnpm exec electron-builder ${{ matrix.builder }} --publish never
          --config.extraMetadata.version="$KOMA_EXPECT_VERSION"
          --config.publish.channel=nightly
          --config.publish.releaseType=prerelease
      - name: Test the packaged application
        working-directory: apps/desktop
        run: node scripts/verify-packaged.mjs ${{ matrix.platform }}
      - uses: actions/upload-artifact@v7
        with:
          name: nightly-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/nightly*.yml
      - name: Keep the results of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: packaged-test-results-${{ matrix.platform }}
          path: apps/desktop/test-results
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish
    needs: [guard, ci-coverage, quality, package]
    if: |
      always() &&
      needs.guard.result == 'success' &&
      needs.package.result == 'success' &&
      (needs.quality.result == 'success' || (needs.quality.result == 'skipped' && needs.ci-coverage.outputs.covered == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.guard.outputs.version }}
      TAG: ${{ needs.guard.outputs.tag }}
      SHA: ${{ needs.guard.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.guard.outputs.sha }}
      - uses: actions/download-artifact@v8
        with:
          pattern: nightly-*
          path: release-assets
          merge-multiple: true
      - name: Check and stage the files
        run: node apps/desktop/scripts/stage-release-assets.mjs release-assets "$VERSION" nightly
      - name: Create a draft with the checked files
        run: |
          cat > release-notes.md <<EOF
          Nightly preview built from \`$SHA\`. It contains unfinished changes. Keep copies of your projects. The installers are not signed.

          ## Install or update on macOS

          Run this in Terminal to install this nightly:

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/Dytschgo/koma-motion/main/scripts/install.sh | KOMA_MOTION_RELEASE_TAG=$TAG bash
          \`\`\`
          EOF
          gh release create "$TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --draft \
            --prerelease \
            --latest=false \
            --title "Koma Motion $VERSION (nightly)" \
            --notes-file release-notes.md
      - name: Publish as a prerelease
        run: |
          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --prerelease \
            --latest=false
