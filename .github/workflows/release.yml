name: Publish stable release

# A stable release is published by pushing a tag such as v0.1.0 that points
# to a commit of main. See docs/RELEASES.md.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  classify:
    name: Check the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.classify.outputs.sha }}
      version: ${{ steps.classify.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: classify
        shell: bash
        run: |
          set -euo pipefail
          channel="$(node apps/desktop/scripts/release-channel.mjs classify-tag "$GITHUB_REF_NAME")"
          test "$channel" = stable
          candidate="$(git rev-parse "$GITHUB_REF^{commit}")"
          git fetch --force origin +refs/heads/main:refs/remotes/origin/main
          # Only commits of main are released.
          git merge-base --is-ancestor "$candidate" origin/main
          version="$(node -p "require('./apps/desktop/package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "The tag $GITHUB_REF_NAME does not match the version $version of the application." >&2
            exit 1
          fi
          echo "sha=$candidate" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  ci-coverage:
    name: Check existing CI
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      covered: ${{ steps.decision.outputs.covered }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.classify.outputs.sha }}
      - id: decision
        shell: bash
        env:
          SHA: ${{ needs.classify.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&per_page=20" > runs.json
          run_id="$(node apps/desktop/scripts/ci-quality.mjs select-run runs.json "$SHA")"
          if [ -z "$run_id" ]; then
            echo "covered=false" >> "$GITHUB_OUTPUT"
            echo "No completed successful CI run covers ${SHA}." >> "$GITHUB_STEP_SUMMARY"
          else
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" > jobs.json
            covered="$(node apps/desktop/scripts/ci-quality.mjs covers-windows jobs.json)"
            echo "covered=${covered}" >> "$GITHUB_OUTPUT"
            echo "CI run ${run_id} covers the Windows quality checks: ${covered}." >> "$GITHUB_STEP_SUMMARY"
          fi

  quality:
    name: Check the code
    needs: [classify, ci-coverage]
    if: |
      always() &&
      needs.classify.result == 'success' &&
      (needs.ci-coverage.result != 'success' || needs.ci-coverage.outputs.covered != 'true')
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.classify.outputs.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:e2e

  package:
    name: Package (${{ matrix.platform }})
    # Runs beside the checks of the code. Publishing needs both.
    needs: classify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            builder: --win
          - os: macos-latest
            platform: macos
            builder: --mac --universal
    env:
      KOMA_EXPECT_VERSION: ${{ needs.classify.outputs.version }}
      # The installers are not signed with a certificate.
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.classify.outputs.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Package
        working-directory: apps/desktop
        shell: bash
        run: pnpm exec electron-builder ${{ matrix.builder }} --publish never
      - name: Test the packaged application
        working-directory: apps/desktop
        run: node scripts/verify-packaged.mjs ${{ matrix.platform }}
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
      - name: Keep the results of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: packaged-test-results-${{ matrix.platform }}
          path: apps/desktop/test-results
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish
    needs: [classify, ci-coverage, quality, package]
    if: |
      always() &&
      needs.classify.result == 'success' &&
      needs.package.result == 'success' &&
      (needs.quality.result == 'success' || (needs.quality.result == 'skipped' && needs.ci-coverage.outputs.covered == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.classify.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.classify.outputs.sha }}
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Check and stage the files
        run: node apps/desktop/scripts/stage-release-assets.mjs release-assets "$VERSION" latest
      - name: Create a draft with the checked files
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --latest=false \
            --title "Koma Motion $VERSION" \
            --generate-notes
      - name: Publish without marking it as the latest release
        run: |
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest=false

  verify-public-download:
    name: Test the public download
    needs: [classify, publish]
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      KOMA_EXPECT_VERSION: ${{ needs.classify.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.classify.outputs.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download what users download
        shell: bash
        run: |
          set -euo pipefail
          mkdir public-download
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --dir public-download \
            --pattern "Koma-Motion-Setup-$KOMA_EXPECT_VERSION.exe" \
            --pattern SHA256SUMS.txt
          cd public-download
          grep "  Koma-Motion-Setup-$KOMA_EXPECT_VERSION.exe\$" SHA256SUMS.txt | sha256sum --check --strict
      - name: Install and test the download
        working-directory: apps/desktop
        run: node scripts/verify-packaged.mjs windows ../../public-download

  verify-public-download-macos:
    name: Test the public macOS download
    needs: [classify, publish]
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      KOMA_EXPECT_VERSION: ${{ needs.classify.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.classify.outputs.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download what users download
        shell: bash
        run: |
          set -euo pipefail
          mkdir public-download
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --dir public-download \
            --pattern "Koma-Motion-$KOMA_EXPECT_VERSION-universal.dmg" \
            --pattern "Koma-Motion-$KOMA_EXPECT_VERSION-universal-mac.zip" \
            --pattern SHA256SUMS.txt
          cd public-download
          for file in \
            "Koma-Motion-$KOMA_EXPECT_VERSION-universal.dmg" \
            "Koma-Motion-$KOMA_EXPECT_VERSION-universal-mac.zip"
          do
            test -f "$file"
            grep -F "  ${file}" SHA256SUMS.txt | shasum -a 256 -c -
          done
      - name: Unpack and test the download
        working-directory: apps/desktop
        run: node scripts/verify-packaged.mjs macos ../../public-download

  promote-latest:
    name: Mark as the latest release
    needs: [verify-public-download, verify-public-download-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Mark the tested release as the latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --latest
